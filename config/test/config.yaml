# 测试环境配置
# 切换环境：改 TEST_ENV 环境变量，或复制一份 config/staging/config.yaml

env_name: test

# 被测服务地址
base_url: "https://jsonplaceholder.typicode.com"

# 请求默认超时（秒）
# 公开 API 或返回体较大的接口需放宽超时，或改用分页请求。
timeout: 30

# 失败自动重试次数（0 = 不重试）
# 公网/第三方依赖建议开启；内网接口可设 0。
# 仅对超时、连接错误与 5xx 重试；4xx 不重试。
retries: 2

# 是否打印请求/响应日志
verbose: true

# 数据库配置（用于「接口返回成功 → 数据真的落库」一致性校验）
# 本项目用 SQLite（免安装、免密码，CI 可直接运行）。
# 换 MySQL 只需改 driver 与连接信息，common/db.py 上层方法不变。
database:
  enabled: true
  driver: "sqlite"
  path: "data/test.db"