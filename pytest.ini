[pytest]
# 把项目根目录加入 sys.path，这样 testcases/ 里才能 import common.xxx
pythonpath = .

testpaths = testcases

# 默认命令行参数：-v 显示用例名，-ra 显示跳过/xfail 原因汇总
addopts = -v -ra --strict-markers --tb=short

# 自定义标记（--strict-markers 会拒绝未注册的标记）
markers =
    slow: 耗时较长的用例，默认不跑（-m "not slow"）
    smoke: 冒烟用例，每次提交都跑
    regression: 回归用例