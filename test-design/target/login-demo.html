<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f6f8;color:#1a1a1a;
  font:15px/1.6 -apple-system,"Segoe UI","Microsoft YaHei","PingFang SC",sans-serif}
.phone{max-width:420px;margin:0 auto;min-height:100vh;background:#fff;padding:56px 28px 24px;
  display:flex;flex-direction:column;box-shadow:0 0 24px rgba(0,0,0,.06)}
h1{font-size:24px;margin:0 0 6px;font-weight:600}
.sub{color:#888;font-size:13px;margin:0 0 26px;min-height:20px}
input[type=text],input[type=password]{width:100%;height:48px;border:1px solid #ddd;border-radius:8px;
  padding:0 14px;font-size:16px;outline:none;background:#fafafa;transition:.15s}
input:focus{border-color:#07c160;background:#fff}
button{width:100%;height:48px;border:0;border-radius:8px;font-size:16px;margin-top:16px;
  cursor:pointer;background:#07c160;color:#fff;transition:.15s}
button:disabled{background:#c8e6d0;cursor:not-allowed}
.link{display:block;text-align:center;color:#576b95;font-size:14px;margin-top:16px;cursor:pointer}
.err{color:#e54d42;font-size:13px;min-height:20px;margin:10px 0 0}
.agree{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:#666;margin-top:18px;line-height:1.5}
.agree input{margin-top:3px;flex:none;accent-color:#07c160}
.foot{margin-top:auto;text-align:center;color:#bbb;font-size:12px;padding-top:28px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="phone">

  <section id="s1">
    <h1>登录</h1>
    <p class="sub">请输入手机号</p>
    <input id="phone" type="text" inputmode="numeric" placeholder="手机号" autocomplete="off">
    <p class="err" id="e1"></p>
    <button id="next" disabled>下一步</button>
    <a class="link" id="sms">用短信验证码登录</a>
  </section>

  <section id="s2" hidden>
    <h1>输入密码</h1>
    <p class="sub" id="who"></p>
    <input id="pwd" type="password" placeholder="密码" autocomplete="off">
    <p class="err" id="e2"></p>
    <button id="login">登录</button>
    <label class="agree">
      <input type="checkbox" id="agree">
      <span>我已阅读并同意《用户协议》和《隐私政策》</span>
    </label>
    <a class="link" id="back1">返回上一步</a>
  </section>

  <section id="s3" hidden>
    <h1>登录成功</h1>
    <p class="sub" id="who2"></p>
    <button id="back2">退出登录</button>
  </section>

  <div class="foot">登录即代表你同意服务条款</div>
</div>

<script>
(function () {
  'use strict';

  var USERS = {
    '13800138000': 'abc123',
    '13900139000': 'test1234'
  };

  var phone = '';
  var failMap = {};   // 手机号 -> { count, lockUntil }
  var $ = function (id) { return document.getElementById(id); };
  var show = function (id) {
    ['s1', 's2', 's3'].forEach(function (x) { $(x).hidden = (x !== id); });
  };

  // 手机号：仅保留数字，最多 11 位
  $('phone').addEventListener('input', function () {
    this.value = this.value.replace(/\D/g, '').slice(0, 11);
    $('next').disabled = this.value.length === 0;
  });

  // 下一步：非空即可进入密码页
  $('next').addEventListener('click', function () {
    phone = $('phone').value;
    $('who').textContent = phone;
    show('s2');
    $('pwd').focus();
  });

  $('login').addEventListener('click', function () {
    var pwd = $('pwd').value;
    var now = Date.now();
    var rec = failMap[phone] || { count: 0, lockUntil: 0 };

    // 锁定检查
    if (now < rec.lockUntil) {
      $('e2').textContent = '尝试过于频繁，请稍后再试';
      return;
    }

    if (!pwd) {
      $('e2').textContent = '登录失败，密码不能为空';
      return;
    }

    if (pwd.length < 6 || pwd.length > 20) {
      $('e2').textContent = '密码长度应为 6-20 位';
      return;
    }

    // 协议校验
    if (!$('agree').checked) {
      $('e2').textContent = '请先阅读并同意用户协议';
      return;
    }

    // 防重复提交
    var btn = this;
    btn.disabled = true;
    setTimeout(function () { btn.disabled = false; }, 800);

    if (USERS[phone] && USERS[phone] === pwd) {
      failMap[phone] = { count: 0, lockUntil: 0 };
      $('who2').textContent = phone;
      show('s3');
    } else {
      rec.count += 1;
      if (rec.count >= 5) {
        rec.lockUntil = now + 60000;
        rec.count = 0;
        $('e2').textContent = '尝试过于频繁，请稍后再试';
      } else {
        $('e2').textContent = '账号或密码错误';
      }
      failMap[phone] = rec;
    }
  });

  $('back1').addEventListener('click', function () {
    $('e2').textContent = '';
    show('s1');
  });

  $('back2').addEventListener('click', function () {
    phone = '';
    $('phone').value = '';
    $('pwd').value = '';
    $('e2').textContent = '';
    $('next').disabled = true;
    $('agree').checked = false;
    show('s1');
  });

  $('sms').addEventListener('click', function () {
    alert('短信验证码登录暂未开放');
  });
})();
</script>
</body>
</html>
