# 岗位接口测试数据
# 数据与代码分离：新增用例只加数据行，测试逻辑不用改。

# ---------- 正常场景数据（等价类：有效） ----------
valid_posts:
  - case_id: "POST-001"
    desc: "标准长度的标题与正文"
    title: "接口自动化测试实践"
    body: "使用 pytest + requests 搭建框架"
    userId: 1
  - case_id: "POST-002"
    desc: "最短有效标题（1 个字符）"
    title: "a"
    body: "b"
    userId: 1
  - case_id: "POST-003"
    desc: "包含中文与特殊符号"
    title: "标题@#$%^&*()"
    body: "正文包含换行\n和制表符\t"
    userId: 2
  - case_id: "POST-004"
    desc: "包含 emoji（易触发编码问题）"
    title: "测试😀🚀"
    body: "emoji 在 UTF-8 下应正常传输"
    userId: 3

# ---------- 查询用 id 集合 ----------
valid_ids: [1, 2, 10, 50, 100]

# ---------- 异常场景数据（等价类：无效） ----------
# jsonplaceholder 不校验参数，这两组在 mock 上会返回 201；
# 用例以 xfail 标记，接真实接口后应返回 400/422。
invalid_posts:
  - case_id: "NEG-001"
    desc: "缺少必填字段 title"
    payload: {body: "没有标题", userId: 1}
    expect_status: [400, 422]
  - case_id: "NEG-002"
    desc: "title 类型错误（传数字）"
    payload: {title: 12345, body: "标题是数字", userId: 1}
    expect_status: [400, 422]

# ---------- 响应结构基线 ----------
post_schema:
  userId: int
  id: int
  title: str
  body: str

# ---------- 性能基线 ----------
perf:
  # 响应时间阈值（毫秒）。公共 API 走公网，放宽到 3000ms。
  max_response_ms: 3000
